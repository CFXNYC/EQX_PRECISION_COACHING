<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EQX Precision Coaching Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<!-- Club Portfolio tab (Phase 4) — Leaflet + its own scoped stylesheet.
     This remains the always-on fallback renderer (see js/render-portfolio.js's
     activateGlobeMode) — kept loaded unconditionally, same as before. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<!-- High-fidelity globe upgrade (feature/high-fidelity-globe) — optional,
     only activates once js/globe-config.js has a real Mapbox token. -->
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css">
<link rel="stylesheet" href="css/portfolio.css">
<link rel="stylesheet" href="css/globe.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     LOADING / ERROR OVERLAYS — shown while data.js fetches and
     joins the two source JSON files. Never removed in favor of
     mock data on failure.
═══════════════════════════════════════════════════════════════ -->
<div id="app-loading" class="app-overlay">
  <div class="app-loading-spinner"></div>
  <div class="app-loading-text">Loading Precision Coaching data…</div>
</div>

<div id="app-error" class="app-overlay hidden">
  <div class="app-error-card">
    <div class="app-error-icon">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <div class="app-error-title">Something went wrong</div>
    <div class="app-error-detail"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     TOP BAR + PRIMARY NAVIGATION
═══════════════════════════════════════════════════════════════ -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-text">
      <h1>EQX Precision Coaching Dashboard</h1>
      <div class="meta">
        <span id="topbar-coach-count">— coaches</span>
        <span class="meta-sep">·</span>
        <span id="topbar-club-count">— pilot clubs</span>
        <span class="meta-sep">·</span>
        <span>As of <strong id="topbar-asof">—</strong></span>
        <span class="meta-sep">·</span>
        <span>Loaded <strong id="topbar-loaded">—</strong></span>
      </div>
    </div>
    <div class="topbar-logo"><img src="img/eqx-o-logo-white.png" alt="EQX"></div>
  </div>
  <nav class="primary-nav">
    <button class="nav-tab active" data-view="overview" onclick="App.showView('overview')">Overview</button>
    <button class="nav-tab" data-view="professionalism" onclick="App.showView('professionalism')">Professionalism</button>
    <button class="nav-tab" data-view="performance" onclick="App.showView('performance')">Performance</button>
    <button class="nav-tab" data-view="programming" onclick="App.showView('programming')">Programming</button>
    <button class="nav-tab" data-view="portfolio" onclick="App.showView('portfolio')">Club Portfolio</button>
  </nav>
</div>

<!-- ═══════════════════════════════════════════════════════════
     VIEWS — populated by js/render-*.js at runtime
═══════════════════════════════════════════════════════════════ -->
<div id="view-overview" class="view active"></div>
<div id="view-professionalism" class="view"></div>
<div id="view-performance" class="view"></div>
<div id="view-programming" class="view"></div>
<div id="view-coach" class="view"></div>
<div id="view-portfolio" class="view"></div>

<div class="footer-note">EQX Precision Coaching Dashboard</div>

<!-- ═══════════════════════════════════════════════════════════
     BOOTSTRAP — js/data.js fetches both JSON source files, joins
     them, builds window.PRECISION_DATA, then injects every other
     script (calculations → recommendations → charts → components
     → page renderers → app) in order, only once data is ready.
     See js/data.js for the full architecture note.

     Loaded via a tiny inline cache-buster (Date.now(), same approach
     data.js itself already uses for every file it loads) rather than a
     plain <script src>, so an edit to data.js is never served stale by
     a browser or CDN cache the way a static src attribute would be.
═══════════════════════════════════════════════════════════════ -->
<script>document.write('<script src="js/data.js?v=' + Date.now() + '"><' + '/script>');</script>
</body>
</html>
